name: Build installer

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installer JAR
        run: ./gradlew clean test verifyFatJarContents

      - name: Upload installer JAR
        uses: actions/upload-artifact@v4
        with:
          name: automodpack-neoforge-installer
          path: build/libs/*-fatjar.jar
          if-no-files-found: error